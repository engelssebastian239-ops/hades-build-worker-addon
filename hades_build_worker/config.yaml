name: "H.A.D.E.S. Build Worker"
version: "0.0.5-dev.m5.6"
slug: "hades_build_worker"
description: "Read-only signed H.A.D.E.S. diagnostics. Arbitrary code execution is disabled."
arch:
  - aarch64
startup: application
boot: manual_only
stage: experimental
init: false
host_network: false
host_ipc: false
host_pid: false
host_uts: false
homeassistant_api: false
hassio_api: false
docker_api: false
full_access: false
apparmor: true
privileged: []
devices: []
map: []
ports: {}
ports_description: {}
ingress: false
tmpfs: true
ulimits:
  nofile: 128
options:
  enabled: false
  package_stage_enabled: false
  listen_port: 8765
  trusted_broker_id: ""
  trusted_broker_public_key: ""
schema:
  enabled: bool
  package_stage_enabled: bool
  listen_port: int
  trusted_broker_id: str
  trusted_broker_public_key: str
