name: H.A.D.E.S. Add-on ARM64 Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hades-addon-arm64-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-tests-and-build:
    name: Regression tests and isolated ARM64 image builds
    if: github.event.pull_request.head.repo.full_name == 'engelssebastian239-ops/hades-build-worker-addon'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout candidate with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check architecture and version contract
        run: |
          set -eu
          test "$(uname -m)" = "aarch64"
          node -e "const fs=require('fs'); const yaml=fs.readFileSync('hades_build_worker/config.yaml','utf8'); const v=yaml.match(/^version: \"([^\"]+)\"/m)?.[1]; if(v!=='0.0.6-dev.m5.12'||JSON.parse(fs.readFileSync('package.json','utf8')).version!==v)process.exit(1); console.log('M5.7 verified candidate version',v)"
      - name: Worker full regression suite
        run: npm test
      - name: Worker syntax checks
        run: |
          set -eu
          npm run syntax
          sh -n hades_m35_puller/run.sh
      - name: Build ARM64 Home Assistant Worker image (do not publish)
        run: |
          set -eu
          docker build --progress=plain --tag hades-worker:m57-ci ./hades_build_worker
          docker image inspect hades-worker:m57-ci --format '{{.Architecture}} {{.Os}}'
      - name: Build ARM64 H.A.D.E.S. M3.5 Puller image (do not publish)
        run: |
          set -eu
          docker build --progress=plain --tag hades-m35-puller:ci ./hades_m35_puller
          test "$(docker image inspect hades-m35-puller:ci --format '{{.Architecture}} {{.Os}}')" = 'arm64 linux'
