name: H.A.D.E.S. Add-on ARM64 Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hades-addon-arm64-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-tests-and-build:
    name: Regression tests and isolated ARM64 image builds
    if: github.event.pull_request.head.repo.full_name == 'engelssebastian239-ops/hades-build-worker-addon'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU for ARM64 image builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          cache-image: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check version contract
        run: |
          set -eu
          node -e "const fs=require('fs'); const yaml=fs.readFileSync('hades_build_worker/config.yaml','utf8'); const v=yaml.match(/^version: \"([^\"]+)\"/m)?.[1]; if(v!=='0.0.6-dev.m5.13'||JSON.parse(fs.readFileSync('package.json','utf8')).version!==v)process.exit(1); console.log('M5.13 verified candidate version',v)"
      - name: Worker full regression suite
        run: npm test
      - name: Worker syntax checks
        run: |
          set -eu
          npm run syntax
          node --check hades_build_worker/worker/mobile-install-plan.mjs
          node --check hades_build_worker/worker/mobile-install-queue.mjs
          node --check hades_build_worker/worker/mobile-install-receipt.mjs
          node --check hades_build_worker/worker/mobile-install-client.mjs
          node --check hades_build_worker/worker/mobile-install-store.mjs
          node --check hades_build_worker/worker/mobile-install-controller.mjs
          node --check hades_build_worker/worker/mobile-install-github.mjs
          node --check hades_build_worker/worker/mobile-install-runtime.mjs
          sh -n hades_m35_puller/run.sh
      - name: Build ARM64 Home Assistant Worker image (do not publish)
        run: |
          set -eu
          docker buildx build --platform linux/arm64 --load --progress=plain --tag hades-worker:m57-ci ./hades_build_worker
          test "$(docker image inspect hades-worker:m57-ci --format '{{.Architecture}} {{.Os}}')" = 'arm64 linux'
      - name: Import actual Worker runtime graph in restricted ARM64 image
        run: |
          set -eu
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 --entrypoint /usr/bin/node hades-worker:m57-ci --input-type=module -e "await import('file:///opt/hades-m42.5/worker/main.mjs'); console.log('Worker runtime module graph loaded')"
      - name: Build ARM64 H.A.D.E.S. M3.5 Puller image (do not publish)
        run: |
          set -eu
          docker buildx build --platform linux/arm64 --load --progress=plain --tag hades-m35-puller:ci ./hades_m35_puller
          test "$(docker image inspect hades-m35-puller:ci --format '{{.Architecture}} {{.Os}}')" = 'arm64 linux'
      - name: Build ARM64 scoped Mobile installer image (do not publish)
        run: |
          set -eu
          docker buildx build --platform linux/arm64 --load --progress=plain --tag hades-mobile-installer:m575-ci ./hades_mobile_installer
          test "$(docker image inspect hades-mobile-installer:m575-ci --format '{{.Architecture}} {{.Os}}')" = 'arm64 linux'
      - name: Import installer runtime in restricted image
        run: |
          set -eu
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 --entrypoint /usr/bin/node hades-mobile-installer:m575-ci --input-type=module -e "const m=await import('file:///opt/hades-m575/installer.mjs'); if(m.INSTALL_PROTOCOL!=='HADES_MOBILE_M574_INSTALL_V1'||m.TARGET_DIR!=='/addons/hades_m2_mobile') process.exit(1); console.log('M575 installer module graph loaded')"
